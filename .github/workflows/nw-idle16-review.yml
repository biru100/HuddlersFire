name: NW sixteen frame breathing review

on:
  push:
    branches: [art/nw16-fixed-pixels-20261109]

permissions:
  contents: write

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --only-binary=:all: 'Pillow==11.3.0'
      - name: Author and verify frames without regenerated character art
        run: |
          python tools/author-idle16-anchored.py --anchor art/sprites/source-registry/rounded02-idle-frames-nw-03/base/frame01-anchor.png --peak art/sprites/incoming/idle-core03-f2-pixel-pilot-20261109/frame02-inhale.png --mask art/sprites/source-registry/rounded02-idle-frames-nw-03/motion-plan/COMPOSITE_MASK.bin --out outputs/nw16-anchor-review
      - name: Upload immutable frame and preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: nw16-fixed-pixel-review
          path: outputs/nw16-anchor-review/
          retention-days: 30
      - name: Commit review-only derived images to this art branch
        run: |
          set -e
          dest=art/sprites/incoming/nw-idle16-fixed-pixel-review-20261109
          if [ -e "$dest/TECHNICAL_REVIEW.json" ]; then
            cmp "$dest/TECHNICAL_REVIEW.json" outputs/nw16-anchor-review/TECHNICAL_REVIEW.json
            exit 0
          fi
          mkdir -p "$dest"
          cp -a outputs/nw16-anchor-review/. "$dest/"
          git add -- "$dest"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "art(review): 16 stable fixed-pixel idle frames"
          git push origin HEAD:refs/heads/art/nw16-fixed-pixels-20261109
