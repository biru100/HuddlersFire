name: Idle core03 preparation without deployment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/idle-core-prepare.yml'
      - 'tools/maintenance/apply-idle-core03.py'

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'art/rounded02-idle-review-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Apply exact-input reviewed source changes
        run: python3 tools/maintenance/apply-idle-core03.py
      - name: Install pinned validation dependencies
        run: |
          cd web
          npm ci
          cd ..
          node tools/setup-sprite-gen.mjs
      - name: Run current code checks; no application startup or deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/core03-ci
          cd web
          npm test 2>&1 | tee ../outputs/core03-ci/full-tests.log
          npm run test:sprites:pipeline 2>&1 | tee ../outputs/core03-ci/pipeline.log
          npm run test:idle-frames 2>&1 | tee ../outputs/core03-ci/frames.log
          npm run typecheck 2>&1 | tee ../outputs/core03-ci/typecheck.log
          npm run lint 2>&1 | tee ../outputs/core03-ci/lint.log
          CAMP_WORKER_NAME=huddlers-fire-ci CAMP_D1_DATABASE_ID=11111111-2222-4333-8444-555555555555 npm run build 2>&1 | tee ../outputs/core03-ci/build.log
      - name: Prepare exact anchor, frozen core mask and pending frame job
        run: |
          node tools/prepare-idle-core03.mjs | tee outputs/core03-ci/preparation.json
          node tools/art-source-registry.mjs verify --manifest art/sprites/source-registry/rounded02-idle-frames-nw-03/MANIFEST.json > outputs/core03-ci/registry.json
          git diff --check
      - name: Commit tested preparation only to the existing PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git diff --exit-code -- tools/lib/art-direction.mjs art/sprites/art-direction.json web/lib web/public
          git add tools/idle-frames.mjs tools/lib/idle-checks.mjs tools/lib/idle-composite.mjs web/package.json AGENTS.md .agents/skills/camp-animation-art/SKILL.md docs/briefs/rounded-02/idle-frame-workflow.md art/sprites/source-registry/rounded02-idle-frames-nw-03
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply tested core-only anchor guard and prepare pending NW pilot'
          git push origin HEAD:"$HEAD_BRANCH"
          git rev-parse HEAD > outputs/core03-ci/COMMIT.txt
      - name: Capture exact prepared files and test logs
        if: always()
        run: |
          mkdir -p outputs/core03-ci
          tar -czf outputs/core03-ci/prepared-source.tar.gz tools/idle-frames.mjs tools/lib/idle-checks.mjs tools/lib/idle-composite.mjs tools/lib/idle-core-request.mjs tools/prepare-idle-core03.mjs web/tests/idle-core-selection.test.mjs web/package.json docs/briefs/rounded-02/idle-core03-preflight.md docs/briefs/rounded-02/idle-nw-regions-03.json docs/briefs/rounded-02/idle-frame-intent-03.json docs/reviews/2026-11-08-idle-core03-plan-review.md art/sprites/source-registry/rounded02-idle-frames-nw-03 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-core03-preflight-${{ github.event.pull_request.head.sha }}
          path: outputs/core03-ci/
          retention-days: 3
          if-no-files-found: error
