name: Verify existing ChatGPT Sites package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'art/**', 'automation/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test generic multi-image Chat to Work handoff
        working-directory: .
        run: node --test tools/tests/chat-asset-batch.test.mjs
      - name: Inspect real Chat resource batches without changing source pixels
        working-directory: .
        run: node tools/chat-asset-batch.mjs inspect outputs/chat-asset-batch-report.json
      - name: Test automation safety gates
        working-directory: .
        run: node --test tools/tests/autoflow.test.mjs tools/tests/art-handoff.test.mjs tools/tests/sites-package.test.mjs
      - name: Inspect candidate ChatGPT PNG handoffs (no image API)
        working-directory: .
        run: node tools/art-handoff.mjs inspect outputs/art-handoff-report.json
      - name: Validate previously linked Sites project
        working-directory: .
        run: node --input-type=module -e "import {verifyExistingSitesPackage} from './tools/check-sites-package.mjs'; console.log(verifyExistingSitesPackage(undefined, {requireBuild:false}));"
      - name: Verify raw PNG provenance and runtime-art boundary
        working-directory: .
        run: node tools/autoflow.mjs inspect outputs/autoflow-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huddlers-handoff-${{ github.run_id }}
          path: |
            outputs/autoflow-status.json
            outputs/art-handoff-report.json
            outputs/chat-asset-batch-report.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npm ci
      # The setup-uv action downloaded a GitHub Release asset and hit HTTP 504.
      # Use pre-cached Python 3.13 and a fixed official PyPI wheel instead.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned uv from PyPI
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --retries 5 --timeout 30 'uv==0.13.7'
          uv --version
      - name: Install pinned sprite validation tools
        working-directory: .
        run: node tools/setup-sprite-gen.mjs
      - run: npm test
      - name: Reproduce and verify the registered camper atlases
        run: npm run sprites:camper -- --check
      - name: Compare affected art against the previous revision on the same runner
        id: art-review
        working-directory: .
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if ! git rev-parse --verify --quiet "${base:-missing}^{commit}" > /dev/null; then base=$(git rev-parse HEAD^); fi
          art_paths=(web/lib/camp-{art*,camera,canvas-renderer,character,clearing*,draw-context,games,landscape,lighting*,maps,materials,pixel*,prop*,renderer,scene*,seats,shadows,sprite*,style*,webgl*}.mjs
            'web/lib/camp-camper*.mjs' art/sprites/field-camper-v2/shared-head/{masters,recipe.json} web/public/sprites web/public/games 'web/tests/current-art*'
            web/components/camp/character-preview.tsx web/app/camp-{lobby,theme}.css
            web/tests/render-landscapes.mjs web/tests/browser.grounding.mjs 'web/tests/lighting-preview*'
            tools/lib/review-png.mjs tools/build-camper-style.py 'tools/camp_*.py' art/sprites/camper-style-release)
          if git diff --quiet "$base" HEAD -- "${art_paths[@]}"; then exit 0; fi
          echo "capturing=true" >> "$GITHUB_OUTPUT"
          original="$RUNNER_TEMP/art-before"
          mkdir -p "$original"
          git archive "$base" web tools art/sprites/camper-style-release | tar -x -C "$original"
          # Share the capture procedure. Each side loads its own release code, originals and public assets.
          cp web/tests/{current-art-{review,evidence,scenes},render-landscapes,sprite-fixture}.mjs "$original/web/tests/"
          cp tools/lib/review-png.mjs "$original/tools/lib/"
          if cmp -s web/package-lock.json "$original/web/package-lock.json"; then
            ln -s "$GITHUB_WORKSPACE/web/node_modules" "$original/web/node_modules"
          else
            npm ci --prefix "$original/web"
          fi
          node "$original/web/tests/current-art-review.mjs" before ci
          mkdir -p web/outputs/current-art/ci
          cp -R "$original/web/outputs/current-art/ci/before" web/outputs/current-art/ci/
          node web/tests/current-art-review.mjs after ci
          node web/tests/current-art-review.mjs compare ci
      - uses: actions/upload-artifact@v4
        if: always() && steps.art-review.outputs.capturing == 'true'
        with:
          name: current-art-comparison-${{ github.run_id }}
          path: web/outputs/current-art/ci
          retention-days: 14
      - run: npm run typecheck
      - run: npm run lint
      - name: Build existing GPT Sites package, no publication
        run: npm run build
      - name: Check linked Sites project and packaged migrations
        working-directory: .
        run: node tools/check-sites-package.mjs
      - name: Upload review-only Sites preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huddlers-sites-preflight-${{ github.run_id }}
          path: outputs/sites-package-preflight.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publication requires the existing Sites project
        working-directory: .
        run: echo 'Verified source only. Sites versions are saved/reviewed and published in the existing ChatGPT Sites project, never by GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"
