name: Verify existing ChatGPT Sites package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'art/**', 'automation/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test automation safety gates
        working-directory: .
        run: node --test tools/tests/autoflow.test.mjs tools/tests/art-handoff.test.mjs tools/tests/sites-package.test.mjs
      - name: Inspect candidate ChatGPT PNG handoffs (no image API)
        working-directory: .
        run: node tools/art-handoff.mjs inspect outputs/art-handoff-report.json
      - name: Validate previously linked Sites project
        working-directory: .
        run: node --input-type=module -e "import {verifyExistingSitesPackage} from './tools/check-sites-package.mjs'; console.log(verifyExistingSitesPackage(undefined, {requireBuild:false}));"
      - name: Verify raw PNG provenance and runtime-art boundary
        working-directory: .
        run: node tools/autoflow.mjs inspect outputs/autoflow-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huddlers-handoff-${{ github.run_id }}
          path: |
            outputs/autoflow-status.json
            outputs/art-handoff-report.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npm ci
      # The setup-uv action downloaded a GitHub Release asset and hit HTTP 504.
      # Use pre-cached Python 3.13 and a fixed official PyPI wheel instead.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned uv from PyPI
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --retries 5 --timeout 30 'uv==0.13.7'
          uv --version
      - name: Install pinned sprite validation tools
        working-directory: .
        run: node tools/setup-sprite-gen.mjs
      - run: npm test
      - run: npm run test:sprites:pipeline
      - run: npm run typecheck
      - run: npm run lint
      - name: Build existing GPT Sites package, no publication
        run: npm run build
      - name: Check linked Sites project and packaged migrations
        working-directory: .
        run: node tools/check-sites-package.mjs
      - name: Upload review-only Sites preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huddlers-sites-preflight-${{ github.run_id }}
          path: outputs/sites-package-preflight.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publication requires the existing Sites project
        working-directory: .
        run: echo 'Verified source only. Sites versions are saved/reviewed and published in the existing ChatGPT Sites project, never by GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"
