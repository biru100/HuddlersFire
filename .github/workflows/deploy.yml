name: Verify and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations (only after checking target migration history)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/sprite-gen.lock.json
      - name: Install pinned sprite validation tools
        working-directory: .
        run: node tools/setup-sprite-gen.mjs
      - name: Check split-stage art source gates
        run: npm run test:art-production
      - run: npm test
      - run: npm run test:sprites:pipeline
      - run: npm run typecheck
      - run: npm run lint
      - name: Build isolated CI target
        run: npm run build
        env:
          CAMP_WORKER_NAME: huddlers-fire-ci
          CAMP_D1_DATABASE_ID: 11111111-2222-4333-8444-555555555555
      - name: Check Worker packaging without uploading
        run: npm run deploy:check
        env:
          CAMP_WORKER_NAME: huddlers-fire-ci
          CAMP_D1_DATABASE_ID: 11111111-2222-4333-8444-555555555555

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.CAMP_PUBLIC_URL }}
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    env:
      CAMP_WORKER_NAME: ${{ vars.CAMP_WORKER_NAME }}
      CAMP_D1_DATABASE_ID: ${{ vars.CAMP_D1_DATABASE_ID }}
      CAMP_PUBLIC_URL: ${{ vars.CAMP_PUBLIC_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check target settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          for (const name of ['CAMP_WORKER_NAME', 'CAMP_D1_DATABASE_ID', 'CAMP_PUBLIC_URL', 'CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN']) {
            if (!process.env[name]) throw new Error('Missing GitHub production setting: ' + name);
          }
          const url = new URL(process.env.CAMP_PUBLIC_URL);
          if (url.protocol !== 'https:' || url.pathname !== '/' || url.search || url.hash || url.username || url.password) throw new Error('CAMP_PUBLIC_URL must be the HTTPS origin of the target Worker.');
          JS
      - run: npm ci
      - run: npm run build
      - run: npm run deploy:check
      - name: Deploy Worker (optional pending migrations first)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
        run: |
          if [ "$APPLY_MIGRATIONS" = 'true' ]; then
            npm run deploy -- --migrate
          else
            npm run deploy
          fi
      - name: Check public HTML and API
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$CAMP_PUBLIC_URL/" --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$CAMP_PUBLIC_URL/api/camp/version"
